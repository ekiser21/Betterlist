 if(a==="cacc")return W(async()=>{await db.collection("clanm").doc(d.id+"_"+d.u).update({st:"a"});notify(d.u,"clan","You were accepted into "+((CLM.get(d.id)||{}).name||"a clan"));snd("ok")});
 if(a==="ckick")return W(()=>db.collection("clanm").doc(d.id+"_"+d.u).delete());
 if(a==="cdis")return W(async()=>{for(const m of clanm.filter(x=>x.cid===d.id))await db.collection("clanm").doc(m.cid+"_"+m.uid).delete();await db.collection("clans").doc(d.id).delete();go({t:"clans"})});
 if(a==="cclaim"){const c=CH[d.per]&&CH[d.per][+d.idx];if(!c||(p.claimed||[]).some(x=>x.i===d.id)||cprog(p,d.per,c)<c[2])return snd("err");await upd({claimed:[...(p.claimed||[]),{i:d.id,r:0}],spent:(p.spent||0)-c[3]});snd("win");return toast("+"+c[3]+" coins")}
 if(a==="nclr")return W(async()=>{for(const n of nf)await db.collection("notifs").doc(n.id).delete()});
 if(adm&&a==="npost"){const t=$("#nt").value.trim();if(!t)return;return W(async()=>{await db.collection("news").add({text:t.slice(0,200),t:Date.now()});toast("Posted")})}
 if(adm&&a==="ndel")return W(()=>db.collection("news").doc(d.id).delete());
 if(a==="prof2"){const soc={},son=[],gear={};SOC.forEach(s=>{const v=$("#sc_"+s[0]).value.trim().slice(0,60);if(v)soc[s[0]]=v;if($("#so_"+s[0]).checked)son.push(s[0])});GEAR.forEach(x=>{const v=$("#gr_"+x[0]).value.trim().slice(0,40);if(v)gear[x[0]]=v});await upd({soc,son,gear,gon:$("#gon").checked});snd("ok");return toast("Saved")}
 if(a==="bnrup"){const f=$("#bu")&&$("#bu").files[0];if(!f||!p||!(p.owned||[]).includes("feat|bnr"))return;try{await upd({bnr:await toBanner(f)});snd("ok")}catch(x){err=AM["x/img"];render()}return}
 if(a==="bnrrm")return upd({bnr:""});
 if(a==="mk"){const n=$("#pn").value.trim();return W(async()=>{await claim(me,n);snd("ok")})}
 if(a==="send")return send();
 if(a==="cdel")return W(()=>mcol(cr).doc(d.id).delete());
 if(a==="rej"){const r=recs.find(x=>x.id===d.id);return W(async()=>{await db.collection("records").doc(d.id).delete();if(r&&r.uid!==me)notify(r.uid,"review","Your submission for "+r.n+" was rejected")})}
 if(a==="proof"){const s=await db.collection("proofs").doc(d.id).get().catch(()=>null);PR[d.id]=s&&s.exists&&imgOk(s.data().img)?s.data().img:"none";return render()}
 if(staff()&&a==="apr"){const r=recs.find(x=>x.id===d.id);return W(async()=>{await db.collection("records").doc(d.id).update({st:"a"});if(r)notify(r.uid,"review","Your clear of "+r.n+" was approved! "+(r.pct>=100?"+"+LP(r.diff,r.rate)+" points":"Progress saved"));snd("ok")})}
 if(adm){
  if(a==="badd"){const v=$("#bl").value.trim();if(!v)return;return W(()=>db.collection("bounties").add({n:v,lk:/^\d+$/.test(v)?v:slug(v),r:num($("#br").value),note:$("#bn").value.trim()}))}
  if(a==="bdel")return W(()=>db.collection("bounties").doc(d.id).delete());
  if(a==="qadd"){const t=$("#qt").value.trim();if(!t)return;return W(()=>db.collection("quests").add({t,d:$("#qd").value.trim(),r:num($("#qr").value)}))}
  if(a==="qdel")return W(()=>db.collection("quests").doc(d.id).delete());
  if(a==="pts")return W(async()=>{await db.doc("config/points").set({dp:DF.map((x,i)=>num($("#pt"+i).value))});snd("ok");toast("Points saved")})}
 if(!p)return;
 if(a==="sub"){const n=$("#sn").value.trim(),gid=$("#sg").value.replace(/\D/g,""),pct=Math.min(100,parseInt($("#sp").value,10)||0),vid=url($("#sv").value.trim());
  if(!n||!pct||!vid){err="Add the level name, a percent and a video link.";snd("err");return render()}
  const lk=gid||slug(n),id=me+"_"+lk;if(!lk){err="That level name isn’t valid.";return render()}
  if(recs.some(r=>r.id===id)){err="You already submitted that level.";snd("err");return render()}
  const f=$("#si").files[0],rec={uid:me,lk,gid,n:n.slice(0,60),by:$("#sb").value.trim().slice(0,40),diff:+$("#sd").value,rate:+$("#sr").value,pct,att:parseInt($("#sa2").value,10)||0,vid,st:adm?"a":"p",t:Date.now()};
  b.disabled=true;let im="";if(f)try{im=await toImg(f,900,0,.6)}catch(x){}
  return W(async()=>{await db.collection("records").doc(id).set(rec);if(im)await db.collection("proofs").doc(id).set({img:im});sel=null;snd("ok");toast(adm?"Added":"Submitted for review")})}
 if(a==="prof"){const dp=$("#pd"),pt={bio:$("#pb").value.trim().slice(0,300),flag:$("#pf").value},f=$("#pp").files[0];
  if(dp&&!dp.disabled&&dp.value.trim()!==(p.display||"")){pt.display=dp.value.trim().slice(0,24);pt.dispAt=Date.now()}
  if(f)try{pt.pfp=await toImg(f,128,128)}catch(x){err=AM["x/img"]}
  await upd(pt);snd("ok");return render()}
 if(a==="claim"){const c=p.claimed||[];if(c.some(x=>x.i===d.id))return;await upd({claimed:[...c,{i:d.id,r:+d.r||0}]});snd("buy");return toast("+"+(+d.r||0)+" coins")}
 if(a==="buy"){const it=SHM.get(d.k);if(!it||(p.owned||[]).includes(d.k)||B(p)<it[3])return snd("err");
  await upd({owned:[...(p.owned||[]),d.k],spent:(p.spent||0)+it[3],equip:it[0]==="feat"?e2:{...e2,[it[0]]:it[1]}});snd("buy");return toast("Bought "+it[2])}
 if(a==="eq"){const[k,v]=d.k.split("|");if(!(p.owned||[]).includes(d.k))return;return upd({equip:{...e2,[k]:v}})}
 if(a==="uneq"){const q={...e2};delete q[d.k.split("|")[0]];return upd({equip:q})}
 if(a==="spin"){if(spinning)return;const free=Date.now()-(p.ws||0)>=864e5;if(!free&&B(p)<WCOST){err="Not enough coins.";snd("err");return render()}
  const tot=WP.reduce((x,w)=>x+w[2],0);let r=Math.random()*tot,i=0;for(;i<WP.length-1;i++){if(r<WP[i][2])break;r-=WP[i][2]}
  spinning=true;b.disabled=true;await upd({...(free?{ws:Date.now()}:{spent:(p.spent||0)+WCOST}),act:actInc(p,["g","s"])});
  const w=$("#wheel"),base=(Math.floor((S.wr||0)/360)+6)*360,end=base+360-(i*45+22);S.wr=end%360;sv();
  w.style.transition="transform 4.5s cubic-bezier(.15,.7,.1,1)";w.style.transform=`rotate(${end}deg)`;
  for(let k=0;k<9;k++){await sleep(500);snd("spin")}
  spinning=false;const pr=WP[i][1],q=mine();await upd({spent:(q.spent||0)-pr});snd(pr?"win":"err");toast(pr?"You won "+pr+" coins!":"Bust. Better luck next time.");return render()}
 if(a==="flip"||a==="dice"){const bet=Math.floor(+$(a==="flip"?"#gb":"#gb2").value);if(!(bet>=1&&bet<=5000)||bet>B(p)){err="Pick a bet you can afford (1 to 5000).";snd("err");return render()}
  let rl=0;const win=a==="flip"?(Math.random()<.5?"h":"t")===d.k:(rl=1+Math.floor(Math.random()*100),d.k==="o"?rl>50:rl<50);
  await upd({spent:(p.spent||0)+(win?-Math.round(bet*.9):bet),act:actInc(p,["g"])});snd(win?"win":"err");
  return toast((rl?"Rolled "+rl+". ":"")+(win?"You won "+Math.round(bet*.9)+" coins!":"You lost "+bet+" coins."))}
});
